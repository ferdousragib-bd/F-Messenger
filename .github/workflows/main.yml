
      - name: Set Java target to 17
        working-directory: source/FMessenger
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()
          old = s

          s = s.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )
          s = s.replace(
              'JavaVersion.toVersion("1.8")',
              'JavaVersion.toVersion("17")'
          )

          if s == old:
              print(s)
              raise SystemExit("Java 1.8 target not found")

          p.write_text(s)
          print("Java target updated to 17")
          PY
          
