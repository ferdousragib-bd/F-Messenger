name: Build F Messenger APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FMessenger-Android-Project.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o FMessenger-Android-Project.zip -d source
          ls -la source/FMessenger

      - name: Fix Compose Compiler
        working-directory: source/FMessenger
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "org.jetbrains.kotlin.plugin.compose" not in s:
              s, count = re.subn(
                  r'(plugins\s*\{)',
                  r'\1\n    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21"',
                  s,
                  count=1
              )
              if count == 0:
                  raise SystemExit("Could not find plugins block")

          s = re.sub(
              r'(?ms)^\s*composeOptions\s*\{.*?^\s*\}\s*',
              '\n',
              s
          )

          p.write_text(s)
          print("Compose Compiler plugin configured successfully")
          PY

      - name: Build APK
        working-directory: source/FMessenger
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: F-Messenger-APK
          path: source/FMessenger/app/build/outputs/apk/debug/app-debug.apk
          
