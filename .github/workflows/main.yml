
name: Build F Messenger APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FMessenger-Android-Project.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o FMessenger-Android-Project.zip -d source

      - name: Fix Compose and JVM Target
        working-directory: source/FMessenger
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          # Add the Compose compiler plugin
          if "org.jetbrains.kotlin.plugin.compose" not in s:
              s, count = re.subn(
                  r'(plugins\s*\{)',
                  r'\1\n    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21"',
                  s,
                  count=1
              )
              if count == 0:
                  raise SystemExit("ERROR: Plugins block not found")

          # Remove old Compose compiler configuration
          s = re.sub(
              r'(?ms)^\s*composeOptions\s*\{.*?^\s*\}\s*',
              '\n',
              s
          )

          # Set Java compatibility to 17
          s = s.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )
          s = s.replace(
              'JavaVersion.toVersion("1.8")',
              'JavaVersion.toVersion("17")'
          )

          # Force both Java and Kotlin compilation to JVM 17
          marker = "// F MESSENGER JVM TARGET FIX"
          if marker not in s:
              s += """

          // F MESSENGER JVM TARGET FIX
          tasks.withType<org.gradle.api.tasks.compile.JavaCompile>().configureEach {
              sourceCompatibility = "17"
              targetCompatibility = "17"
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions.jvmTarget = "17"
          }
          """

          p.write_text(s)
          print("Compose and JVM target configuration completed")
          PY

      - name: Build APK
        working-directory: source/FMessenger
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: F-Messenger-APK
          path: source/FMessenger/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
