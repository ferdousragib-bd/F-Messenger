
name: Build F Messenger APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FMessenger-Android-Project.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o FMessenger-Android-Project.zip -d source
          cp MainActivity.kt source/FMessenger/app/src/main/java/com/fmessenger/chat/MainActivity.kt

      - name: Fix MainActivity and Gradle
        working-directory: source/FMessenger
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # The repository's root MainActivity.kt is copied into the app module above.
          main_file = Path("app/src/main/java/com/fmessenger/chat/MainActivity.kt")
          if not main_file.exists():
              raise SystemExit("MainActivity.kt source file missing")
          print("Social app source selected")

          # Fix Gradle configuration
          p = Path("app/build.gradle.kts")
          s = p.read_text()

          # Add media upload and remote image rendering dependencies.
          if "com.google.firebase:firebase-storage" not in s:
              s = re.sub(r'(dependencies\s*\{)', r'\1\n    implementation("com.google.firebase:firebase-storage:21.0.1")', s, count=1)
          if "io.coil-kt:coil-compose" not in s:
              s = re.sub(r'(dependencies\s*\{)', r'\1\n    implementation("io.coil-kt:coil-compose:2.7.0")', s, count=1)

          if "org.jetbrains.kotlin.plugin.compose" not in s:
              s, count = re.subn(
                  r'(plugins\s*\{)',
                  r'\1\n    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21"',
                  s,
                  count=1
              )
              if count == 0:
                  raise SystemExit("Plugins block not found")

          s = re.sub(
              r'(?ms)^\s*composeOptions\s*\{.*?^\s*\}\s*',
              '\n',
              s
          )

          s = s.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          s += """

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          """

          p.write_text(s)
          print("Gradle configuration completed")
          PY

      - name: Build APK
        working-directory: source/FMessenger
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: F-Messenger-APK
          path: source/FMessenger/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
