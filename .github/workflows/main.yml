name: Build F Messenger APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FMessenger-Android-Project.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          unzip -o FMessenger-Android-Project.zip -d source
          cd source/FMessenger
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: F-Messenger-APK
          path: source/FMessenger/app/build/outputs/apk/debug/app-debug.apk
          
