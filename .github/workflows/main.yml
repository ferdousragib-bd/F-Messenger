
name: Build F Messenger APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FMessenger-Android-Project.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o FMessenger-Android-Project.zip -d source

      - name: Fix Compose and JVM Target
        working-directory: source/FMessenger
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "org.jetbrains.kotlin.plugin.compose" not in s:
              s, count = re.subn(
                  r'(plugins\s*\{)',
                  r'\1\n    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21"',
                  s,
                  count=1
              )
              if count == 0:
                  raise SystemExit("ERROR: Plugins block not found")

          s = re.sub(
              r'(?ms)^\s*composeOptions\s*\{.*?^\s*\}\s*',
              '\n',
              s
          )

          # Configure Android Java compatibility directly
          s += """

          // F MESSENGER: Java compatibility 17
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          // F MESSENGER: Kotlin JVM target 17
          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          """

          p.write_text(s)
          print("Java and Kotlin JVM targets set to 17")
          PY

      - name: Verify JVM Target
        working-directory: source/FMessenger
        run: |
          grep -n -A4 "compileOptions" app/build.gradle.kts
          grep -n -A3 "jvmTarget" app/build.gradle.kts

      - name: Build APK
        working-directory: source/FMessenger
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: F-Messenger-APK
          path: source/FMessenger/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
